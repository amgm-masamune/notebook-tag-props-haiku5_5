name: CI

on:
  push:
    branches-ignore:
      - ci-screenshots
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace > gradle-unit.log 2>&1 || { tail -n 150 gradle-unit.log; exit 1; }
          tail -n 30 gradle-unit.log
      - name: Summarize test results
        if: always()
        run: python3 scripts/summarize_tests.py "app/build/test-results/testDebugUnitTest/*.xml" summary.md "unit-test"
      - name: Post CI summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/extract_gradle_errors.py gradle-unit.log gradle-errors.md
          {
            echo "## CI結果: unit-test (${{ job.status }})"
            echo
            cat summary.md
            if [ "${{ job.status }}" != "success" ] || ! grep -q '^### ' summary.md; then
              echo
              echo "### Gradle エラー（抜粋）"
              echo
              cat gradle-errors.md
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat comment.md)" || true
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            gradle-unit.log
            gradle-errors.md
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  android-test:
    name: android-test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 30 は API 33 未満のフォールバック表示の検証用
          - api-level: 30
            target: google_apis
            arch: x86_64
          - api-level: 34
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # emulator-runner は script を行ごとに sh -c で実行する（bash ではない）ので PIPESTATUS や pipefail は使わない
          script: |
            chmod +x ./gradlew && ./gradlew :app:connectedDebugAndroidTest :app:assembleDebugAndroidTest --no-daemon --stacktrace > gradle-android.log 2>&1 || { tail -n 150 gradle-android.log; exit 1; }
            tail -n 30 gradle-android.log
      - name: Summarize test results
        if: always()
        run: python3 scripts/summarize_tests.py "app/build/outputs/androidTest-results/connected/**/*.xml" summary.md "android-test (API ${{ matrix.api-level }})"
      - name: Post CI summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/extract_gradle_errors.py gradle-android.log gradle-errors.md
          {
            echo "## CI結果: android-test API${{ matrix.api-level }} (${{ job.status }})"
            echo
            cat summary.md
            if [ "${{ job.status }}" != "success" ] || ! grep -q '^### ' summary.md; then
              echo
              echo "### Gradle エラー（抜粋）"
              echo
              cat gradle-errors.md
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat comment.md)" || true
      - name: Publish screenshots to ci-screenshots branch
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish_screenshots.sh \
            app/build/outputs/connected_android_test_additional_output \
            "${{ github.repository }}" "${GITHUB_SHA::7}" "${{ matrix.api-level }}" screenshots.md
      - name: Post screenshot links
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s screenshots.md ]; then
            {
              echo "## スクリーンショット api${{ matrix.api-level }}"
              echo
              cat screenshots.md
            } > screenshots_comment.md
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat screenshots_comment.md)" || true
          fi
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            gradle-android.log
            gradle-errors.md
          if-no-files-found: warn
          retention-days: 14
      - name: Upload androidTest APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk-api${{ matrix.api-level }}
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
